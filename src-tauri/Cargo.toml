[package]
name = "toki-desktop"
version = "0.1.0"
description = "TOKI — Industrial Operating System (desktop)"
authors = ["Toki"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "toki_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toki-core = { path = "../rust/toki-core" }
